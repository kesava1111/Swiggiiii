<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swiggy - Login</title>
    <style>
        :root { --swiggy-orange: #fc8019; --text-dark: #3d4152; --text-light: #686b78; --bg: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg); color: var(--text-dark); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; padding: 20px; text-align: center; }
        .logo { font-size: 2.5rem; font-weight: 800; color: var(--swiggy-orange); margin-bottom: 10px; letter-spacing: -1px; }
        .logo span { color: var(--text-dark); }
        .subtitle { font-size: 1.1rem; font-weight: 600; margin-bottom: 30px; color: var(--text-dark); }
        .view { display: none; animation: fade 0.3s ease; }
        .view.active { display: block; }
        @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group label { font-size: 0.8rem; color: var(--text-light); margin-bottom: 5px; display: block; }
        .phone-wrapper { display: flex; align-items: center; border-bottom: 2px solid #e0e0e0; padding-bottom: 5px; transition: border 0.2s; }
        .phone-wrapper:focus-within { border-color: var(--swiggy-orange); }
        .prefix { font-size: 1.1rem; font-weight: 600; color: var(--text-dark); margin-right: 10px; }
        input { width: 100%; border: none; outline: none; font-size: 1.1rem; color: var(--text-dark); background: transparent; padding: 10px 0; }
        
        .btn { width: 100%; padding: 16px; background: var(--swiggy-orange); border: none; border-radius: 8px; color: white; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; transition: opacity 0.2s; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .status { margin-top: 20px; font-size: 0.85rem; color: var(--text-light); min-height: 20px; }
        .status.err { color: #e53935; }
        .status.ok { color: #43a047; }
        
        .resend { margin-top: 15px; font-size: 0.9rem; color: var(--swiggy-orange); cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">Swiggy<span>.</span></div>
    
    <div id="v1" class="view active">
        <div class="subtitle">Login or Sign up</div>
        <div class="input-group">
            <label>Mobile Number</label>
            <div class="phone-wrapper">
                <span class="prefix">+91</span>
                <input type="tel" inputmode="numeric" id="inPhone" placeholder="Enter mobile number" maxlength="10" autocomplete="off">
            </div>
        </div>
        <button type="button" id="btn1" class="btn" onclick="sendOtp()">Continue</button>
    </div>

    <div id="v2" class="view">
        <div class="subtitle">Enter OTP</div>
        <div class="input-group">
            <label>Sent to +91 <span id="showNum" style="color:var(--text-dark)"></span></label>
            <div class="phone-wrapper">
                <input type="tel" inputmode="numeric" id="inOtp" placeholder="Enter 6-digit OTP" maxlength="6" autocomplete="off" style="text-align:center; letter-spacing: 5px;">
            </div>
        </div>
        <button type="button" id="btn2" class="btn" onclick="verifyOtp()">Verify</button>
        <div class="resend" onclick="sendOtp()">Resend OTP</div>
    </div>

    <div class="status" id="statusMsg"></div>
</div>

<script>
    const API = window.location.origin;
    let state = {};

    function setStatus(msg, cls) {
        const el = document.getElementById("statusMsg");
        el.innerText = msg;
        el.className = "status " + (cls || "");
    }

    function go(id) {
        document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
        document.getElementById(id).classList.add("active");
    }

    function decodeJwt(jwt) {
        try {
            const p = jwt.split(".")[1];
            if (!p) return {};
            let b = p.replace(/-/g, '+').replace(/_/g, '/');
            while (b.length % 4) b += '=';
            return JSON.parse(decodeURIComponent(atob(b).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
        } catch { return {}; }
    }

    async function sendOtp() {
        const ph = document.getElementById("inPhone").value.trim();
        if (!/^\d{10}$/.test(ph)) return setStatus("Please enter a valid 10-digit number", "err");

        const btn = document.getElementById("btn1");
        btn.disabled = true;
        setStatus("Sending OTP...");

        try {
            const r = await fetch(API + "/api/otp?mobile=" + ph);
            const d = await r.json();

            if (d.statusCode === 0) {
                let tid = d.tid, sid = d.sid;
                if (!sid && tid) sid = decodeJwt(tid).sid;
                state = { phone: ph, tid: tid, sid: sid, deviceId: d.deviceId || d._devId };
                document.getElementById("showNum").innerText = ph;
                go("v2");
                setStatus("OTP sent successfully!", "ok");
            } else {
                setStatus(d.statusMessage || "Failed to send OTP", "err");
                btn.disabled = false;
            }
        } catch (err) { setStatus("Network error", "err"); btn.disabled = false; }
    }

    async function verifyOtp() {
        const otp = document.getElementById("inOtp").value.trim();
        if (!/^\d{4,6}$/.test(otp)) return setStatus("Enter valid OTP", "err");

        const btn = document.getElementById("btn2");
        btn.disabled = true;
        setStatus("Verifying...");

        try {
            const r = await fetch(API + "/api/verify", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ otp: otp, phone: state.phone, tid: state.tid, sid: state.sid, deviceId: state.deviceId })
            });
            const d = await r.json();

            if (d.statusCode !== 0) { setStatus(d.statusMessage || "Verification failed", "err"); btn.disabled = false; return; }

            const sess = {};
            const inner = typeof d.data === "object" ? d.data : {};
            ["token", "tid", "sid"].forEach(k => { if (inner[k]) sess[k] = inner[k]; else if (d[k]) sess[k] = d[k]; });
            sess.deviceId = String(d.deviceId || state.deviceId);
            const uid = decodeJwt(sess.tid || "").user_id;

            if (!uid) { setStatus("Session incomplete", "err"); btn.disabled = false; return; }

            sess.userid = String(uid); sess.mobile = state.phone;
            if (!sess.customerId) sess.customerId = sess.userid;

            setStatus("Login successful! Downloading session...", "ok");
            const blob = new Blob([JSON.stringify(sess, null, 4)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "swiggy_session_" + sess.mobile + ".json";
            a.click();
            URL.revokeObjectURL(a.href);

            setTimeout(() => {
                state = {};
                document.getElementById("inPhone").value = "";
                document.getElementById("inOtp").value = "";
                document.getElementById("btn1").disabled = false; // FIX: Re-enable button
                document.getElementById("btn2").disabled = false; // FIX: Re-enable button
                setStatus("");
                go("v1");
            }, 3000);

        } catch (err) { setStatus("Network error", "err"); btn.disabled = false; }
    }
</script>
</body>
</html>
